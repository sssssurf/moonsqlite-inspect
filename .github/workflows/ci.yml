name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check MoonBit compiler version
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          report = subprocess.check_output(["moon", "version", "--all"], text=True)
          print(report, end="")
          compiler = re.search(
              r"(?m)^moonc[ \t]+v?(\d+)\.(\d+)\.(\d+)"
              r"(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?(?=\s|$)",
              report,
          )
          if compiler is None:
              raise SystemExit("Could not identify moonc in 'moon version --all'.")
          version = tuple(map(int, compiler.groups()[:3]))
          prerelease = compiler[4]
          # At 1.0.0, the leading prerelease identifier determines its order relative to rc1.
          if version < (1, 0, 0) or (
              version == (1, 0, 0)
              and prerelease is not None
              and prerelease.split(".", 1)[0] < "rc1"
          ):
              raise SystemExit("Acceptance requires moonc 1.0.0-rc1 or newer.")
          PY
      - name: Verify library and SQLite fixtures
        run: |
          moon update
          for target in js native wasm wasm-gc; do
            moon check --target "$target" --deny-warn
            moon build --target "$target" --frozen --deny-warn
            moon test --target "$target" --frozen --deny-warn
          done
          moon fmt --check
          python3 -B scripts/sqlite_oracle.py
          python3 -B scripts/history_stress.py
          python3 -B scripts/verify_distribution.py
          python3 -B scripts/verify_readme.py

name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify library and SQLite fixtures
        run: |
          for target in js native wasm wasm-gc; do
            moon check --target "$target" --frozen
            moon build --target "$target" --frozen
            moon test --target "$target" --frozen
          done
          python3 scripts/sqlite_oracle.py
